<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFA 메인 – 화면 시안</title>
<link rel="stylesheet" href="css/sfa-tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- 아이콘 모음 (외부 이미지 없이 인라인 SVG) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 10h16M9 3v4M15 3v4" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 21h4" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8" stroke="currentColor" stroke-width="2"/><path d="M7 6.5a7 7 0 1 0 10 0" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21a8 8 0 0 1 16 0z" fill="currentColor"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" fill="none" stroke="currentColor" stroke-width="3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="3"/><path d="M15 15l6 6" stroke="currentColor" stroke-width="3"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z" fill="currentColor"/><path d="M9 11h7M9 15h7" stroke="#0099e6" stroke-width="2"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="currentColor"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h7v16H4zM13 4h7v16h-7z" fill="currentColor"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M3 5h18v11H9l-5 4V16H3z" fill="currentColor"/></symbol>
  <symbol id="i-remote" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1" fill="currentColor"/><path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 2L1 21h22z" fill="currentColor"/><path d="M12 9v5" stroke="#0099e6" stroke-width="2.4"/><circle cx="12" cy="17.5" r="1.4" fill="#0099e6"/></symbol>
</svg>

<!-- ① 화면 시안 띠: SFA 화면 밖 요소 -->
<div class="proto-band" data-a11y="new" id="band">
  <span class="band-title">화면 시안 – 실제 동작 안 함</span>
  <div class="role-box">
    <span class="lbl" id="role-lbl">보는 사람</span>
    <div class="seg" role="group" aria-labelledby="role-lbl" id="role-seg">
      <button type="button" data-role="FC">FC</button>
      <button type="button" data-role="MANAGER">관리자</button>
      <button type="button" data-role="SALES">영업팀</button>
      <button type="button" data-role="IT">IT</button>
    </div>
    <select class="user-select" id="user-select" aria-label="사용자 선택"></select>
  </div>
  <button type="button" class="ledger-link" id="ledger-link" hidden
          data-notice="결함 대장은 다음 단계에서 만들어요.">결함 대장 열기(다음 단계)</button>
</div>

<!-- ② SFA 메인 (캡처 이미지 전 단계: 회색 레이아웃 블록) -->
<div id="sfa">
  <header class="sfa-header">
    <div class="logo-block" data-a11y="placeholder">[로고]</div>
    <ul class="gnb" data-a11y="sfa">
      <li>고객관리</li><li>활동관리</li><li>DB관리</li><li>계약관리</li><li>재무설계</li>
      <li>가입설계</li><li>청약</li><li>영업관리</li><li>지식관리</li><li>관리자</li>
    </ul>
    <ul class="util" data-a11y="sfa">
      <li>제보</li><li>원격지원</li><li>수수료규정</li><li>메뉴검색</li><li>약관검색</li>
    </ul>
    <div class="icon-group" data-a11y="sfa">
      <button type="button" class="icon-btn" aria-label="스케줄"><svg><use href="#i-cal"/></svg></button>
      <button type="button" class="icon-btn" id="alarm-btn" aria-label="알림" aria-haspopup="dialog" data-entry="alarm">
        <svg><use href="#i-bell"/></svg>
        <span class="badge" id="alarm-badge" data-a11y="badge" hidden></span>
      </button>
      <button type="button" class="icon-btn" aria-label="로그아웃"><svg><use href="#i-power"/></svg></button>
      <div class="alarm-pop" id="alarm-pop" role="dialog" aria-label="알림" hidden>
        <div class="alarm-head" data-a11y="new">내 신고 경과</div>
        <ul class="alarm-list" id="alarm-list" data-a11y="new"></ul>
        <p class="alarm-empty" id="alarm-empty" data-a11y="new" hidden>새 알림이 없어요</p>
      </div>
    </div>
  </header>

  <div class="sfa-body">
    <aside class="col-left">
      <div class="card"><div class="ph" data-a11y="placeholder" style="height:180px">사용자 정보 영역(가림)</div></div>
      <div class="card"><div class="ph" data-a11y="placeholder" style="height:240px">실적 영역(가림)</div></div>
      <div class="card"><div class="ph" data-a11y="placeholder" style="height:160px">목표·현황 영역(가림)</div></div>
    </aside>

    <main class="col-center">
      <section class="card"><div class="ph" data-a11y="placeholder" style="height:150px">일정 영역(가림)</div></section>

      <section class="card">
        <ul class="tabs" data-a11y="sfa">
          <li><button type="button" class="tab is-on" data-sfa="tab">가입설계 이력</button></li>
          <li><button type="button" class="tab" data-sfa="tab">청약진행현황</button></li>
          <li><button type="button" class="tab" data-sfa="tab">신계약보완</button></li>
          <li><button type="button" class="tab" data-sfa="tab">해피콜보완</button></li>
          <li><button type="button" class="tab" data-sfa="tab">계약문서열람</button></li>
        </ul>
        <div class="ph-rows" aria-hidden="true">
          <div class="ph-row"></div><div class="ph-row"></div><div class="ph-row"></div><div class="ph-row"></div><div class="ph-row"></div>
        </div>
      </section>

      <section class="card">
        <ul class="tabs" data-a11y="sfa" id="notice-tabs">
          <li><button type="button" class="tab is-on" data-sfa="tab">일반공지</button></li>
          <li><button type="button" class="tab" data-sfa="tab">시스템공지</button></li>
          <li><button type="button" class="tab" data-sfa="tab">CEO 메시지</button></li>
          <li><button type="button" class="tab" data-sfa="tab">영업자료실</button></li>
          <li><button type="button" class="tab tab-auto" data-sfa="tab" data-entry="tab"
                      data-notice="알려진 오류와 내 신고 화면은 다음 단계에서 만들어요.">알려진 오류·내 신고</button></li>
        </ul>
        <div class="ph-rows" aria-hidden="true">
          <div class="ph-row"></div><div class="ph-row"></div><div class="ph-row"></div><div class="ph-row"></div>
        </div>
      </section>
    </main>

    <aside>
      <ul class="quick" data-a11y="sfa">
        <li><button type="button" class="quick-btn" data-sfa="quick"><span class="quick-ico"><svg><use href="#i-check"/></svg></span><span class="quick-label">신규고객동의</span></button></li>
        <li><button type="button" class="quick-btn" data-sfa="quick"><span class="quick-ico"><svg><use href="#i-check"/></svg></span><span class="quick-label">기존고객동의</span></button></li>
        <li><button type="button" class="quick-btn" data-sfa="quick"><span class="quick-ico"><svg><use href="#i-user"/></svg></span><span class="quick-label">고객종합조회</span></button></li>
        <li><button type="button" class="quick-btn" data-sfa="quick"><span class="quick-ico"><svg><use href="#i-doc"/></svg></span><span class="quick-label">가입설계</span></button></li>
        <li><button type="button" class="quick-btn" data-sfa="quick"><span class="quick-ico"><svg><use href="#i-shield"/></svg></span><span class="quick-label">상세 보장분석</span></button></li>
        <li><button type="button" class="quick-btn" data-sfa="quick"><span class="quick-ico"><svg><use href="#i-play"/></svg></span><span class="quick-label">교육방송</span></button></li>
        <li><button type="button" class="quick-btn" data-sfa="quick"><span class="quick-ico"><svg><use href="#i-book"/></svg></span><span class="quick-label">UW 매뉴얼</span></button></li>
        <li><button type="button" class="quick-btn" data-sfa="quick" data-entry="quick"
                    data-notice="전산 오류 접수 화면(오른쪽에서 열리는 접수 패널)은 다음 단계에서 만들어요."><span class="quick-ico"><svg><use href="#i-alert"/></svg></span><span class="quick-label">전산 오류<br>접수</span></button></li>
        <li><button type="button" class="quick-btn" data-sfa="quick"><span class="quick-ico"><svg><use href="#i-chat"/></svg></span><span class="quick-label">챗봇</span></button></li>
        <li><button type="button" class="quick-btn" data-sfa="quick"><span class="quick-ico"><svg><use href="#i-remote"/></svg></span><span class="quick-label">원격요청</span></button></li>
      </ul>
    </aside>
  </div>
</div>

<!-- ③ 안내 상자 (새 요소) -->
<div class="notice-box" id="notice-box" role="dialog" aria-labelledby="notice-title" data-a11y="new" hidden>
  <h2 id="notice-title">다음 단계에서 구현됩니다</h2>
  <p id="notice-text">이 화면은 다음 단계에서 만들어요.</p>
  <button type="button" class="btn-primary" id="notice-close">닫기</button>
</div>

<script src="js/fixtures/users.js"></script>
<script src="js/fixtures/notifications.js"></script>
<script src="js/api-client.js"></script>
<script src="js/sfa-mock.js"></script>
<script>
  // ?selftest=1 일 때만 화면 자체 검사를 불러온다 (docs/06-ui-spec.md 11절)
  if (/[?&]selftest=1(&|$)/.test(location.search)) {
    var s = document.createElement('script');
    s.src = 'js/dev/selftest.js';
    document.body.appendChild(s);
  }
</script>
</body>
</html>
